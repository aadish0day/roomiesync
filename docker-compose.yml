services:
  mongodb:
    image: mongo:7.0
    container_name: roomiesync-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - roomiesync-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomiesync-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/roomiesync
    depends_on:
      - mongodb
    networks:
      - roomiesync-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roomiesync-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - roomiesync-net

volumes:
  mongodb_data:

networks:
  roomiesync-net:
    driver: bridge

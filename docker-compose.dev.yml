services:
  mongodb:
    image: mongo:7.0
    container_name: roomiesync-mongodb-dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - roomiesync-net-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomiesync-backend-dev
    command: npm run dev
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/roomiesync
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - roomiesync-net-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roomiesync-frontend-dev
    command: npm run dev -- --host
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - roomiesync-net-dev

volumes:
  mongodb_data_dev:

networks:
  roomiesync-net-dev:
    driver: bridge
